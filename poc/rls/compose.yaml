name: pos-platform-rls-poc

services:
  postgres:
    image: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
    environment:
      POSTGRES_DB: rls_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RLS_POC_POSTGRES_PASSWORD:?Set an ephemeral RLS_POC_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rls_poc"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - rls_poc_internal

networks:
  rls_poc_internal:
    internal: true
