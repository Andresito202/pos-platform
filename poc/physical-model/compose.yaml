name: pos-platform-physical-model-poc

services:
  postgres:
    image: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
    environment:
      POSTGRES_DB: physical_model_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PHYSICAL_POC_POSTGRES_PASSWORD:?Set an ephemeral PHYSICAL_POC_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d physical_model_poc"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - physical_poc_internal

networks:
  physical_poc_internal:
    internal: true
