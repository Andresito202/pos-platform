# DEC-010 — Windows packager: electron-builder + NSIS.
# Bundles Electron desktop + POS Local Service payload (WinSW + Node + service
# artifact) via extraResources. Authenticode for Camacho PE remains RT-009-B
# BLOCKED. Do not invent self-signed certs. SCM commercial Desktop↔NT SERVICE
# IPC stays gated: SCM_COMMERCIAL_CHANNEL_IDENTITY_INTEROP_NOT_PROVEN.
appId: com.camachopos.colombia.desktop
productName: Camacho POS Colombia
copyright: Copyright © Camacho POS Colombia
directories:
  output: dist-installer
  buildResources: packaging
files:
  - dist/**/*
  - package.json
extraResources:
  - from: packaging/service-payload
    to: service-payload
    filter:
      - "**/*"
extraMetadata:
  main: dist/start.bundle.mjs
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: packaging/icon.png
  artifactName: CamachoPOSColombia-${version}-win-${arch}.${ext}
  # Windows Authenticode is mandatory for commercial release. This option
  # does not provide a certificate; the release gate remains blocked without it.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Camacho POS Colombia
  deleteAppDataOnUninstall: false
  include: installer.nsh
  # Keep local commercial data across uninstall (SQLite / DPAPI material).
  # Silent install supported via electron-builder NSIS defaults (/S).
  # Elevation required once for WinSW/SCM registration; cashier day-to-day does not.
publish: null
icon: packaging/icon.png
# Fail-closed Electron fuses (Block 2 security phase). Do not re-enable NODE /
# inspect argv or disable ASAR integrity for packaging convenience.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: true
