name: strix-penetration-test

# NOTA DE VERIFICACIÓN (2026-09-05): la especificación original de esta tarea
# pedía `strix-ai/strix-action@v1` autenticado con `secrets.STRIX_TOKEN`. Se
# verificó contra el repositorio oficial (github.com/usestrix/strix, README
# vigente, fetched dos veces) y contra el listado de repos de la organización
# `usestrix`: NO existe ninguna GitHub Action empaquetada `strix-action` en
# `usestrix` ni en `strix-ai`. La integración de CI documentada actualmente es
# instalación por script + CLI, autenticada con `STRIX_LLM` y `LLM_API_KEY`, no
# con un `STRIX_TOKEN`. Este workflow sigue la documentación oficial vigente en
# vez de los parámetros originalmente solicitados, conforme a la instrucción
# explícita de la tarea de preferir la documentación real sobre la inventada.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: strix-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Strix AI penetration test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STRIX_LLM: ${{ secrets.STRIX_LLM }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      # Mismo pin por SHA que el resto del repo (ver codeql-sast.yml,
      # target-foundation-validation.yml) — política de supply chain de
      # TECH-004, no un parámetro propio de Strix.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Un control que falla siempre por configuración no aporta señal: nadie
      # puede distinguir «Strix encontró una vulnerabilidad» de «faltan los
      # secretos». Separar ambos casos es lo que devuelve valor al rojo.
      - name: Check Strix configuration
        id: configuration
        run: |
          missing=""
          [ -n "${STRIX_LLM:-}" ] || missing="${missing} STRIX_LLM"
          [ -n "${LLM_API_KEY:-}" ] || missing="${missing} LLM_API_KEY"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report that the scan did not run
        if: steps.configuration.outputs.configured != 'true'
        env:
          MISSING: ${{ steps.configuration.outputs.missing }}
        run: |
          echo "::warning title=Strix penetration test NOT RUN::Missing repository secrets: ${MISSING}. No penetration test was performed on this pull request."
          {
            echo "## Strix penetration test — **NOT RUN**"
            echo
            echo "Missing repository secrets: \`${MISSING}\`."
            echo
            echo "**No penetration test was performed on this pull request.**"
            echo "A green check here does not mean the change was scanned."
            echo
            echo "See \`docs/security/strix-penetration-test-gate.md\` to configure it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Strix
        if: steps.configuration.outputs.configured == 'true'
        run: curl -sSL https://strix.ai/install | bash

      # Configurado, el fallo vuelve a significar lo único que debe significar:
      # el escaneo encontró algo, o no pudo completarse.
      - name: Run Strix
        if: steps.configuration.outputs.configured == 'true'
        run: strix -n -t ./ --scan-mode quick
