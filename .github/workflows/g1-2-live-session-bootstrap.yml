name: G1.2 Live Session Bootstrap

on:
  push:
    branches:
      - main
      - claude/pos-camacho-bloque-4c-ld43py
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-2-live-session-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-live-runtime:
    name: Windows real POS Local Service session bootstrap
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate checked-in session trust root fingerprint
        run: node --test tools/ci/session-trust-anchor.test.mjs

      - name: Typecheck POS Local Service
        run: pnpm --filter @pos-platform/pos-local-service typecheck

      - name: Execute G1.2 real Windows runtime
        run: pnpm --filter @pos-platform/pos-local-service test -- config.test.ts session-trust-key.test.ts session-trust-key-resolver.test.ts session-trust-key-store.test.ts session-trust-bundle-fetcher.test.ts session-trust-refresh-component.test.ts session-bootstrap-runtime.test.ts session-bootstrap-main-runtime.test.ts

      - name: Verify Central Authority trust publication contract
        run: pnpm --filter @pos-platform/central-authority test -- session-trust-publication.test.ts
