name: Android commercial build
on:
  pull_request:
    paths:
      - 'apps/pos-android/**'
      - 'apps/pos-local-service/**'
      - 'packages/**'
      - 'tools/android-runtime/**'
      - '.github/workflows/android-commercial-build.yml'
  workflow_dispatch:
    inputs:
      full_apk:
        description: Build unsigned APK with verified ARM64 runtime
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle -p apps/pos-android --no-daemon commercialIdentityTest
  unsigned-apk:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.full_apk)
    needs: kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision Android SDK and pinned NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools ndk;27.3.13750724'
      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --version
          test -n "${ANDROID_HOME:-}"
          ndk="$ANDROID_HOME/ndk/27.3.13750724"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*27\.3\.13750724[[:space:]]*
          node tools/android-runtime/prepare-runtime.mjs
          python3 tools/android-runtime/verify-runtime-inputs.py tools/android-runtime/build/runtime-inputs
          python3 tools/android-runtime/extract-runtime.py tools/android-runtime/build/runtime-inputs tools/android-runtime/build/runtime-root
          python3 tools/android-runtime/compile-runtime-addon.py tools/android-runtime "$ANDROID_HOME/ndk/27.3.13750724"
          node tools/android-runtime/package-runtime-assets.mjs
          python3 tools/android-runtime/prepare-installed-runtime.py tools/android-runtime/build/runtime-root tools/android-runtime/build/runtime-assets tools/android-runtime/build/installed-runtime
          gradle -p apps/pos-android --no-daemon commercialApk
      - uses: actions/upload-artifact@v4
        with:
          name: camacho-pos-android-unsigned
          path: apps/pos-android/build/commercial-apk/camacho-pos-colombia-unsigned.apk
          if-no-files-found: error
 "$ndk/source.properties"
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang" --version
          "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++" --version
          command -v gpgv
          command -v ar
          python3 --version
      - name: Build verified commercial runtime and unsigned APK
        run: |
          set -euo pipefail
          node tools/android-runtime/prepare-runtime.mjs
          python3 tools/android-runtime/verify-runtime-inputs.py tools/android-runtime/build/runtime-inputs
          python3 tools/android-runtime/extract-runtime.py tools/android-runtime/build/runtime-inputs tools/android-runtime/build/runtime-root
          python3 tools/android-runtime/compile-runtime-addon.py tools/android-runtime "$ANDROID_HOME/ndk/27.3.13750724"
          node tools/android-runtime/package-runtime-assets.mjs
          python3 tools/android-runtime/prepare-installed-runtime.py tools/android-runtime/build/runtime-root tools/android-runtime/build/runtime-assets tools/android-runtime/build/installed-runtime
          gradle -p apps/pos-android --no-daemon commercialApk
      - uses: actions/upload-artifact@v4
        with:
          name: camacho-pos-android-unsigned
          path: apps/pos-android/build/commercial-apk/camacho-pos-colombia-unsigned.apk
          if-no-files-found: error
