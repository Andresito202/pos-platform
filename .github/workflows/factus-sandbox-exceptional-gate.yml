# Gate excepcional FACTUS + FACTUS Pay (sandbox real).
#
# - NO corre en push ni en pull_request.
# - Sólo workflow_dispatch con frase de autorización del propietario.
# - Sólo desde la rama autorizada cursor/commercial-design-review-0d11.
# - Secretos vía GitHub Actions Secrets (nunca en logs).
# - No declara SANDBOX_VERIFIED: emite evidencia OBSERVED por paso.
name: FACTUS sandbox exceptional gate

on:
  workflow_dispatch:
    inputs:
      owner_authorization:
        description: "Escriba exactamente OWNER_AUTHORIZED_SANDBOX_ONLY"
        required: true
        type: string
      reviewed_sha:
        description: "SHA exacto revisado a ejecutar (40 hex). Debe existir en la rama autorizada."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: factus-sandbox-exceptional
  cancel-in-progress: false

env:
  AUTHORIZED_BRANCH: cursor/commercial-design-review-0d11
  AUTHORIZATION_PHRASE: OWNER_AUTHORIZED_SANDBOX_ONLY

jobs:
  exceptional-sandbox:
    name: FACTUS and FACTUS Pay sandbox exceptional
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CAMACHO_FACTUS_SANDBOX_EXCEPTIONAL: ${{ inputs.owner_authorization }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      CAMACHO_SANDBOX_EVIDENCE_DIR: ${{ github.workspace }}/artifacts/factus-sandbox-exceptional
      FACTUS_SANDBOX_CLIENT_ID: ${{ secrets.FACTUS_SANDBOX_CLIENT_ID }}
      FACTUS_SANDBOX_CLIENT_SECRET: ${{ secrets.FACTUS_SANDBOX_CLIENT_SECRET }}
      FACTUS_SANDBOX_USERNAME: ${{ secrets.FACTUS_SANDBOX_USERNAME }}
      FACTUS_SANDBOX_PASSWORD: ${{ secrets.FACTUS_SANDBOX_PASSWORD }}
      FACTUS_PAY_SANDBOX_EMAIL: ${{ secrets.FACTUS_PAY_SANDBOX_EMAIL }}
      FACTUS_PAY_SANDBOX_PASSWORD: ${{ secrets.FACTUS_PAY_SANDBOX_PASSWORD }}

    steps:
      - name: Refuse ordinary CI surfaces
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "REFUSED: only workflow_dispatch"
            exit 2
          fi
          if [ "${{ github.ref }}" != "refs/heads/${AUTHORIZED_BRANCH}" ]; then
            echo "REFUSED: branch must be ${AUTHORIZED_BRANCH} (got ${{ github.ref }})"
            exit 2
          fi
          if [ "${{ inputs.owner_authorization }}" != "${AUTHORIZATION_PHRASE}" ]; then
            echo "REFUSED: owner_authorization phrase mismatch"
            exit 2
          fi
          if ! printf '%s' "${{ inputs.reviewed_sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "REFUSED: reviewed_sha must be 40 lowercase hex"
            exit 2
          fi

      - name: Checkout exact reviewed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.reviewed_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SHA belongs to authorized branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${AUTHORIZED_BRANCH}"
          if ! git merge-base --is-ancestor "${REVIEWED_SHA}" "origin/${AUTHORIZED_BRANCH}"; then
            echo "REFUSED: ${REVIEWED_SHA} is not an ancestor of origin/${AUTHORIZED_BRANCH}"
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "${REVIEWED_SHA}"
          echo "REVIEWED_SHA_OK=${REVIEWED_SHA}"

      - name: Refuse missing repository secrets
        run: |
          set -euo pipefail
          missing=0
          for name in FACTUS_SANDBOX_CLIENT_ID FACTUS_SANDBOX_CLIENT_SECRET FACTUS_SANDBOX_USERNAME FACTUS_SANDBOX_PASSWORD FACTUS_PAY_SANDBOX_EMAIL FACTUS_PAY_SANDBOX_PASSWORD; do
            # Bash nameref over env — values never printed.
            if [ -z "${!name:-}" ]; then
              echo "MISSING_SECRET_NAME=${name}"
              missing=1
            else
              echo "SECRET_PRESENT_NAME=${name}"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck fiscal adapters and POS local service
        run: |
          set -euo pipefail
          pnpm --filter @pos-platform/fiscal-adapters typecheck
          pnpm --filter @pos-platform/pos-local-service typecheck

      - name: Execute exceptional sandbox gate (redacted)
        run: |
          set -euo pipefail
          mkdir -p "${CAMACHO_SANDBOX_EVIDENCE_DIR}"
          pnpm --filter @pos-platform/pos-local-service exec tsx ../../tools/operators/factus-sandbox-exceptional-gate.ts

      - name: Upload redacted evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: factus-sandbox-exceptional-${{ inputs.reviewed_sha }}
          path: artifacts/factus-sandbox-exceptional/
          if-no-files-found: warn
          retention-days: 14

      - name: Boundary reminder
        if: always()
        run: |
          echo "claim_level=OBSERVED_ONLY"
          echo "sandbox_verified_declared=false"
          echo "production_calls=forbidden"
          echo "ordinary_pr_ci=not_used"
