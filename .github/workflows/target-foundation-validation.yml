name: TARGET foundation validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PUSH_BEFORE_SHA: ${{ github.event.before || '' }}

concurrency:
  group: target-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-push-governance:
    name: Main push governance
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main push comes from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          validated_commits="$(
            bash tools/ci/validate-main-push-history.sh "$PUSH_BEFORE_SHA" "$REVIEWED_SHA"
          )"
          mapfile -t introduced_mainline_commits <<<"$validated_commits"

          for commit_sha in "${introduced_mainline_commits[@]}"; do
            associated_prs="$(
              curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/pulls"
            )"

            matching_prs="$(
              printf '%s' "$associated_prs" \
                | jq --arg sha "$commit_sha" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length'
            )"

            if [ "$matching_prs" -lt 1 ]; then
              echo "::error::main commit ${commit_sha} is not the merge_commit_sha of a merged pull request targeting main."
              exit 1
            fi
          done

          echo "Main push governance PASS for ${#introduced_mainline_commits[@]} introduced first-parent commit(s), ending at ${REVIEWED_SHA}."

  supply-chain-baseline:
    name: Repository policy, dependency inventory and vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate supply-chain tooling regressions
        run: pnpm ci:supply-chain-tests

      - name: Validate repository and secret policy
        run: pnpm ci:repository-policy

      - name: Validate main push history regression
        run: bash tools/ci/test-main-push-history.sh

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate dependency and license inventory
        run: pnpm ci:dependency-inventory

      - name: Run fail-closed dependency vulnerability audit
        run: pnpm ci:vulnerability-audit

      - name: Generate and validate CycloneDX SBOM
        run: pnpm ci:sbom

      - name: Evaluate SPDX license compatibility
        run: pnpm ci:license-gate

      - name: Upload license compatibility evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: license-compatibility-${{ env.REVIEWED_SHA }}
          path: |
            artifacts/ci/license-compatibility-report.json
            artifacts/ci/license-compatibility-report.json.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload CycloneDX SBOM evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom-${{ env.REVIEWED_SHA }}
          path: |
            artifacts/ci/bom.cdx.json
            artifacts/ci/bom.cdx.json.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload dependency vulnerability evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-vulnerability-audit-${{ env.REVIEWED_SHA }}
          path: |
            artifacts/ci/dependency-audit.json
            artifacts/ci/dependency-vulnerability-evaluation.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload dependency inventory evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-dependency-inventory-${{ env.REVIEWED_SHA }}
          path: artifacts/ci/dependency-inventory.json
          if-no-files-found: error
          retention-days: 90

  validate:
    name: TypeScript, SQLite and PostgreSQL 16.14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_TEST_URL: postgres://postgres@127.0.0.1:55432/postgres
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate executable architecture boundaries
        run: pnpm architecture:check

      - name: Validate executable contracts
        run: pnpm test:contracts

      - name: Validate domain rules
        run: pnpm test:domain

      - name: Validate application use cases
        run: pnpm test:application

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate POS Local Service runtime foundation
        run: pnpm test:runtime

      - name: Validate SQLite migration
        run: pnpm test:migrations:sqlite

      - name: Validate PostgreSQL migrations 001/002/003 including physical runner
        run: pnpm test:migrations:postgres

      - name: Validate MAT-003 preflight tooling
        run: pnpm --filter @pos-platform/target-migrations test:preflight:003

      - name: Validate MAT-003 role-readiness tooling
        run: pnpm --filter @pos-platform/target-migrations test:role-readiness:003

      - name: Emit TARGET exact-head validation evidence
        shell: bash
        env:
          EVIDENCE_SHA: ${{ env.REVIEWED_SHA }}
          EVIDENCE_RUN_ID: ${{ github.run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVIDENCE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          semantic_catalog_sha256="$(
            grep -oE 'semanticCatalogSha256: "[0-9a-f]{64}"' tools/target-migrations/src/contract.ts               | tail -1               | cut -d'"' -f2
          )"
          test -n "$semantic_catalog_sha256"

          cat > artifacts/ci/target-exact-head-validation.md <<EOF
          # TARGET exact-head validation evidence

          - repository: ${GITHUB_REPOSITORY}
          - reviewed_sha: ${EVIDENCE_SHA}
          - workflow_run_id: ${EVIDENCE_RUN_ID}
          - workflow_run_attempt: ${EVIDENCE_RUN_ATTEMPT}
          - event: ${EVIDENCE_EVENT}
          - architecture_boundaries: PASS
          - executable_contracts: PASS
          - repository_policy: PASS
          - postgres: 16.14
          - semantic_catalog_sha256: ${semantic_catalog_sha256}
          - typecheck: PASS
          - pos_local_service_runtime_test_suite: PASS
          - sqlite_local_runtime_test_suite: PASS
          - local_channel_runtime_test_suite: PASS
          - local_security_runtime_test_suite: PASS
          - sqlite_migrations: PASS
          - postgres_001_002_003_and_physical_runner: PASS
          - fiscal_model_a_regression: PASS
          - mat_003_preflight: PASS
          - mat_003_role_readiness: PASS

          This evidence is commit-scoped. Runtime test-suite PASS means only that the checked tests passed at this SHA; it does not by itself close RT-001..RT-004 or prove Windows ACLs, multiprocess crash recovery, OS-bound secret custody, release readiness, providers, security-gate promotion, merge authorization, or production deployment.
          EOF

      - name: Upload TARGET exact-head validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-exact-head-${{ env.REVIEWED_SHA }}
          path: artifacts/ci/target-exact-head-validation.md
          if-no-files-found: error
          retention-days: 90


  runtime-windows:
    name: Windows local runtime platform checks
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Windows local runtime packages
        run: pnpm --filter @pos-platform/database-sqlite typecheck && pnpm --filter @pos-platform/pos-local-service typecheck

      - name: Validate Windows SQLite backup, restore and recovery
        run: pnpm --filter @pos-platform/database-sqlite test

      - name: Validate Windows POS Local Service runtime
        run: pnpm --filter @pos-platform/pos-local-service test

  provenance:
    name: Provenance evidence
    needs:
      - supply-chain-baseline
      - validate
      - runtime-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Validate provenance tamper regressions
        run: node --test tools/ci/provenance-manifest.test.mjs

      - name: Collect exact-head provenance inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci/collect-provenance-evidence.sh

      - name: Generate and validate provenance manifest
        env:
          PROVENANCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          PROVENANCE_PNPM_VERSION: 9.15.0
          PROVENANCE_CODEQL_VERSION: 4.37.9
          PROVENANCE_CODEQL_SHA: cdf488f595d80d6e07e03d4674febd5ab45fa938
          PROVENANCE_UPLOAD_VERSION: 7.0.1
          PROVENANCE_UPLOAD_SHA: 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
          GITHUB_NATIVE_ATTESTATION_STATUS: BLOCKED_BY_PLATFORM
          GITHUB_NATIVE_ATTESTATION_REASON: PRIVATE_REPOSITORY_ENTERPRISE_CLOUD_PREREQUISITE_NOT_ESTABLISHED
        run: node tools/ci/provenance-manifest.mjs

      - name: Upload exact-head provenance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-evidence-${{ env.REVIEWED_SHA }}
          path: |
            artifacts/ci/provenance-manifest.json
            artifacts/ci/provenance-manifest.json.sha256
            artifacts/ci/provenance-source-index.json
          if-no-files-found: error
          retention-days: 90
