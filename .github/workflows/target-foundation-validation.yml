name: TARGET foundation validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  PUSH_BEFORE_SHA: ${{ github.event.before || '' }}

concurrency:
  group: target-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-push-governance:
    name: Main push governance
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify main push comes from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          before_sha="$PUSH_BEFORE_SHA"
          zero_sha="0000000000000000000000000000000000000000"

          if ! [[ "$before_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$before_sha" = "$zero_sha" ]; then
            echo "::error::main push has no valid pre-push SHA; the compensating control cannot prove the introduced first-parent range."
            exit 1
          fi

          if ! git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            echo "::error::pre-push main commit ${before_sha} is unavailable in the checkout."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$before_sha" "$REVIEWED_SHA"; then
            echo "::error::main push is not a fast-forward from ${before_sha} to ${REVIEWED_SHA}."
            exit 1
          fi

          mapfile -t introduced_mainline_commits < <(
            git rev-list --first-parent --reverse "${before_sha}..${REVIEWED_SHA}"
          )

          if [ "${#introduced_mainline_commits[@]}" -eq 0 ]; then
            echo "::error::main push introduced no verifiable first-parent commit."
            exit 1
          fi

          expected_parent="$before_sha"
          for commit_sha in "${introduced_mainline_commits[@]}"; do
            parents="$(git show -s --format=%P "$commit_sha")"
            parent_count="$(awk '{print NF}' <<<"$parents")"
            first_parent="$(awk '{print $1}' <<<"$parents")"

            if [ "$first_parent" != "$expected_parent" ]; then
              echo "::error::main first-parent chain is discontinuous at ${commit_sha}; expected parent ${expected_parent}, found ${first_parent}."
              exit 1
            fi

            if [ "$parent_count" -ne 2 ]; then
              echo "::error::main introduced non-merge commit ${commit_sha}. Direct pushes and squash/rebase merges are not accepted."
              exit 1
            fi

            committer_email="$(git show -s --format=%ce "$commit_sha")"
            if [ "$committer_email" != "noreply@github.com" ]; then
              echo "::error::main merge commit ${commit_sha} was not created by GitHub."
              exit 1
            fi

            associated_prs="$(
              curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${commit_sha}/pulls"
            )"

            matching_prs="$(
              printf '%s' "$associated_prs" \
                | jq --arg sha "$commit_sha" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | length'
            )"

            if [ "$matching_prs" -lt 1 ]; then
              echo "::error::main commit ${commit_sha} is not the merge_commit_sha of a merged pull request targeting main."
              exit 1
            fi

            expected_parent="$commit_sha"
          done

          if [ "$expected_parent" != "$REVIEWED_SHA" ]; then
            echo "::error::validated first-parent range did not terminate at the pushed main SHA."
            exit 1
          fi

          echo "Main push governance PASS for ${#introduced_mainline_commits[@]} introduced first-parent commit(s), ending at ${REVIEWED_SHA}."

  supply-chain-baseline:
    name: Repository policy and dependency inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate repository and secret policy
        run: pnpm ci:repository-policy

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate dependency and license inventory
        run: pnpm ci:dependency-inventory

      - name: Upload dependency inventory evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-dependency-inventory-${{ env.REVIEWED_SHA }}
          path: artifacts/ci/dependency-inventory.json
          if-no-files-found: error
          retention-days: 30

  validate:
    name: TypeScript, SQLite and PostgreSQL 16.14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_TEST_URL: postgres://postgres@127.0.0.1:55432/postgres
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate SQLite migration
        run: pnpm test:migrations:sqlite

      - name: Validate PostgreSQL migrations 001 and 002
        run: pnpm test:migrations:postgres

      - name: Validate MAT-003 preflight tooling
        run: pnpm --filter @pos-platform/target-migrations test:preflight:003

      - name: Validate MAT-003 role-readiness tooling
        run: pnpm --filter @pos-platform/target-migrations test:role-readiness:003
