name: TARGET foundation validation

on:
  push:
    branches:
      - architecture/physical-model
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: target-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-baseline:
    name: Repository policy and dependency inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate repository and secret policy
        run: pnpm ci:repository-policy

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate dependency and license inventory
        run: pnpm ci:dependency-inventory

      - name: Upload dependency inventory evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-dependency-inventory-${{ env.REVIEWED_SHA }}
          path: artifacts/ci/dependency-inventory.json
          if-no-files-found: warn
          retention-days: 30

  validate:
    name: TypeScript, SQLite and PostgreSQL 16.14
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_TEST_URL: postgres://postgres@127.0.0.1:55432/postgres
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate SQLite migration
        run: pnpm test:migrations:sqlite

      - name: Validate PostgreSQL migrations 001 and 002
        run: pnpm test:migrations:postgres

      - name: Validate MAT-003 preflight tooling
        run: pnpm --filter @pos-platform/target-migrations test:preflight:003

      - name: Validate MAT-003 role-readiness tooling
        run: pnpm --filter @pos-platform/target-migrations test:role-readiness:003
