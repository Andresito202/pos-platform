name: QR-001 Nequi Bre-B validation

on:
  pull_request:
    branches:
      - feat/android-commercial-runtime
      # A QA PR targeting this feature branch runs the same isolated
      # PostgreSQL/contract suite without changing the protected base branch.
      - feat/nequi-breb-static-qr-phase1
    paths:
      - 'apps/central-authority/src/merchant-destination-*.ts'
      - 'apps/central-authority/src/merchant-notification-inbox.ts'
      - 'apps/central-authority/src/merchant-notification-ingest-routes.ts'
      - 'apps/central-authority/tests/merchant-notification-ingest-routes.test.ts'
      - 'apps/central-authority/tests/merchant-notification-inbox.test.ts'
      - 'apps/central-authority/tests/merchant-destination-*.test.ts'
      - 'apps/central-authority/package.json'
      - 'apps/central-authority/src/isolated-commercial-https.ts'
      - 'apps/central-authority/src/central-commercial-runtime.ts'
      - 'apps/central-authority/src/commercial-browser-entry.ts'
      - 'apps/central-authority/src/main.ts'
      - 'apps/pos-local-service/src/commercial/commercial-request-handler.ts'
      - 'apps/pos-local-service/src/channel/local-channel-component.ts'
      - 'apps/pos-desktop/renderer/src/components/MerchantPaymentMethods.tsx'
      - 'apps/pos-desktop/renderer/src/components/MerchantPaymentNoticePanel.tsx'
      - 'apps/pos-desktop/tests/renderer/MerchantPaymentNoticePanel.test.tsx'
      - 'apps/pos-desktop/renderer/src/components/SalePanel.tsx'
      - 'apps/pos-desktop/tests/renderer/MerchantPaymentMethods.test.tsx'
      - 'apps/pos-desktop/src/preload-api.ts'
      - 'apps/pos-desktop/src/ipc-allowlist.ts'
      - 'packages/contracts/src/ipc-commercial.ts'
      - 'packages/contracts/src/ipc.ts'
      - 'packages/local-channel/src/response-schemas.ts'
      - 'apps/pos-local-service/src/payments/merchant-destination-*.ts'
      - 'apps/pos-local-service/src/payments/merchant-notice-feed.ts'
      - 'apps/pos-local-service/tests/merchant-notice-feed.test.ts'
      - 'apps/pos-android/operational-boundary.test.mjs'
      - 'apps/pos-android/src/main/AndroidManifest.xml'
      - 'apps/pos-android/src/runtime/AndroidManifest.xml'
      - 'apps/pos-local-service/src/payments/sqlite-merchant-destination-*.ts'
      - 'apps/pos-local-service/src/security/merchant-destination-*.ts'
      - 'apps/pos-local-service/tests/merchant-destination-*.test.ts'
      - 'packages/domain/src/merchant-destination*.ts'
      - 'packages/domain/src/merchant-payment-notification.ts'
      - 'packages/domain/tests/merchant-destination*.test.ts'
      - 'packages/domain/tests/merchant-payment-notification.test.ts'
      - 'packages/database-sqlite/src/local-database.ts'
      - 'tools/target-migrations/sql/postgres/024_merchant_payment_destinations.*.sql'
      - 'tools/target-migrations/sql/postgres/025_merchant_payment_notifications.*.sql'
      - 'tools/target-migrations/sql/postgres/026_merchant_payment_notice_reported_details.*.sql'
      - 'tools/target-migrations/sql/postgres/027_merchant_notice_revocation_guard.*.sql'
      - 'tools/target-migrations/tests/postgres-025-merchant-notifications.test.ts'
      - 'tools/target-migrations/src/postgres-commercial-cli.ts'
      - 'tools/target-migrations/src/postgres-commercial-runner.ts'
      - 'tools/target-migrations/src/postgres-commercial-*.ts'
      - 'tools/target-migrations/tests/postgres-024-merchant-destinations.test.ts'
      - 'tools/target-migrations/tests/postgres-024-merchant-destinations-physical.test.ts'
      - 'apps/pos-local-service/src/main.ts'
      - 'apps/pos-local-service/src/config.ts'
      - 'apps/pos-local-service/src/payments/merchant-destination-sync.ts'
      - 'apps/pos-local-service/tests/merchant-destination-sync.test.ts'
      - 'packages/database-postgres/src/device-proof-replay-verifier.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/qr001-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qr001-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qr001:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_QR001_URL: postgres://postgres@127.0.0.1:55435/postgres
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck contracts, domain, Central, POS Local, Electron and migrations
        run: |
          pnpm --filter @pos-platform/contracts typecheck
          pnpm --filter @pos-platform/database-postgres typecheck
          pnpm --filter @pos-platform/domain typecheck
          pnpm --filter @pos-platform/central-authority typecheck
          pnpm --filter @pos-platform/pos-local-service typecheck
          pnpm --filter @pos-platform/target-migrations typecheck
          pnpm --filter @pos-platform/pos-desktop typecheck
      - name: QR-002 Android laboratory manifest isolation
        run: node --test --test-name-pattern='QR-002: laboratory Android manifests' apps/pos-android/operational-boundary.test.mjs
      - name: QR-001 domain unit tests
        if: ${{ !cancelled() }}
        run: pnpm --filter @pos-platform/domain exec vitest run tests/merchant-destination.test.ts tests/merchant-destination-commands.test.ts tests/merchant-destination-snapshot.test.ts tests/merchant-payment-notification.test.ts
      - name: QR-001 Central tests (QR PNG and transaction)
        if: ${{ !cancelled() }}
        run: pnpm --filter @pos-platform/central-authority exec vitest run tests/merchant-destination-qr-asset.test.ts tests/merchant-destination-qr-asset-store.test.ts tests/merchant-destination-postgres-store.test.ts tests/merchant-destination-snapshot-publisher.test.ts tests/merchant-destination-acknowledgements.test.ts tests/merchant-destination-business-operations.test.ts tests/merchant-destination-admin-authorization.test.ts tests/merchant-notification-inbox.test.ts tests/merchant-notification-ingest-routes.test.ts
      - name: QR-001 SQLite and cryptographic tests
        if: ${{ !cancelled() }}
        run: pnpm --filter @pos-platform/pos-local-service exec vitest run tests/merchant-destination-activation.test.ts tests/merchant-destination-projection.test.ts tests/merchant-destination-snapshot-verifier.test.ts tests/merchant-destination-sync.test.ts tests/merchant-notice-feed.test.ts
      - name: QR-001 Electron cashier renderer integration
        if: ${{ !cancelled() }}
        run: pnpm --filter @pos-platform/pos-desktop exec vitest run --config vitest.config.ts tests/renderer/MerchantPaymentMethods.test.tsx tests/renderer/MerchantPaymentNoticePanel.test.tsx
      - name: QR-001 central migration manifest and security gates
        if: ${{ !cancelled() }}
        run: pnpm --filter @pos-platform/target-migrations exec vitest run tests/postgres-024-merchant-destinations.test.ts tests/postgres-025-merchant-notifications.test.ts tests/postgres-024-merchant-destinations-physical.test.ts
