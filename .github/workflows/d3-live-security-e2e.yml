name: D-3 Live Security E2E

on:
  push:
    branches:
      - main
      - claude/pos-camacho-bloque-4c-ld43py
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3-live-security-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  POSTGRES_ADMIN_URL: postgres://postgres@127.0.0.1:55434/camacho_pos
  CENTRAL_DATABASE_URL: postgres://pos_platform_app@127.0.0.1:55434/camacho_pos

jobs:
  d3-live-security-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: camacho_pos
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d camacho_pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck D-3 packages and authority
        run: |
          pnpm --filter @pos-platform/contracts typecheck
          pnpm --filter @pos-platform/device-trust typecheck
          pnpm --filter @pos-platform/pos-local-service typecheck
          pnpm --filter @pos-platform/target-migrations typecheck
          pnpm --filter @pos-platform/central-authority typecheck
      - name: Run D-3 security tests
        run: |
          pnpm --filter @pos-platform/device-trust test
          pnpm --filter @pos-platform/central-authority test -- session-trust-publication.test.ts session-trust-key-issuer.test.ts
          pnpm --filter @pos-platform/pos-local-service test -- device-trust-credential-store.test.ts device-enrollment-service.test.ts session-trust-key.test.ts session-trust-key-resolver.test.ts session-bootstrap-runtime.test.ts
      - name: Apply PostgreSQL 001-002
        run: |
          pnpm --filter @pos-platform/target-migrations exec tsx -e '
            (async () => {
              const { applyPostgres001, applyPostgres002 } = await import("./src/postgres.js");
              const adminUrl = process.env.POSTGRES_ADMIN_URL!;
              await applyPostgres001({ adminUrl });
              await applyPostgres002({ adminUrl });
            })();
          '
      - name: Apply PostgreSQL 003 role readiness
        env:
          POSTGRES_ROLE_READINESS_PROVISIONING_URL: postgres://pos_migrator@127.0.0.1:55434/camacho_pos
          POSTGRES_ROLE_READINESS_VERIFICATION_URL: postgres://pos_platform_admin@127.0.0.1:55434/camacho_pos
          POSTGRES_ROLE_READINESS_ENVIRONMENT_ID: ci-d3
          POSTGRES_ROLE_READINESS_EXPECTED_DATABASE: camacho_pos
          ROLE_READINESS_REPOSITORY_COMMIT: ${{ env.REVIEWED_SHA }}
          ROLE_READINESS_OPERATOR_OR_JOB_ID: github-actions-d3
          ROLE_READINESS_RECEIPT_OUTPUT_PATH: ${{ github.workspace }}/artifacts/d3-role-readiness.json
        run: |
          mkdir -p artifacts
          pnpm --filter @pos-platform/target-migrations role-readiness:003:apply
      - name: Apply PostgreSQL 003
        run: |
          mkdir -p artifacts
          pnpm --filter @pos-platform/target-migrations exec tsx -e '
            (async () => {
              const { applyPostgres003 } = await import("./src/postgres-003-runner.js");
              const result = await applyPostgres003({
                adminUrl: process.env.POSTGRES_ADMIN_URL!,
                expectedDatabase: "camacho_pos",
                environmentId: "ci-d3",
                repositoryCommit: process.env.REVIEWED_SHA!,
                receiptOutputPath: "artifacts/postgres-003.json",
              });
              console.log(JSON.stringify(result));
            })();
          '
      - name: Apply PostgreSQL 004
        env:
          POSTGRES_EXPECTED_DATABASE: camacho_pos
          REPOSITORY_COMMIT: ${{ env.REVIEWED_SHA }}
        run: pnpm --filter @pos-platform/target-migrations postgres:004:apply
      - name: Apply PostgreSQL 037 central rate limit counters
        env:
          POSTGRES_MIGRATOR_URL: postgres://pos_migrator@127.0.0.1:55434/camacho_pos
          POSTGRES_EXPECTED_DATABASE: camacho_pos
          REPOSITORY_COMMIT: ${{ env.REVIEWED_SHA }}
          POSTGRES_MIGRATION_LOCK_TIMEOUT_MS: "5000"
          POSTGRES_MIGRATION_STATEMENT_TIMEOUT_MS: "60000"
        run: pnpm --filter @pos-platform/target-migrations postgres:commercial:apply -- --central-rate-limit
      - name: Configure PostgreSQL TLS for commercial migrations
        env:
          D3_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec --user postgres "$D3_POSTGRES_CONTAINER" openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/d3-postgres.key -out /tmp/d3-postgres.crt -days 1 -subj /CN=localhost -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost'
          docker exec --user postgres "$D3_POSTGRES_CONTAINER" chmod 600 /tmp/d3-postgres.key
          docker exec --user postgres "$D3_POSTGRES_CONTAINER" psql -d camacho_pos -qc "ALTER SYSTEM SET ssl_cert_file='/tmp/d3-postgres.crt'"
          docker exec --user postgres "$D3_POSTGRES_CONTAINER" psql -d camacho_pos -qc "ALTER SYSTEM SET ssl_key_file='/tmp/d3-postgres.key'"
          docker exec --user postgres "$D3_POSTGRES_CONTAINER" psql -d camacho_pos -qc "ALTER SYSTEM SET ssl='on'"
          docker exec --user postgres "$D3_POSTGRES_CONTAINER" psql -d camacho_pos -qc 'SELECT pg_reload_conf()'
          docker cp "$D3_POSTGRES_CONTAINER:/tmp/d3-postgres.crt" "$RUNNER_TEMP/d3-postgres-ca.crt"
          tls_query="sslmode=verify-full&sslrootcert=$RUNNER_TEMP/d3-postgres-ca.crt"
          admin_url="$POSTGRES_ADMIN_URL?$tls_query"
          for attempt in $(seq 1 15); do
            if test "$(psql "$admin_url" -XAt -v ON_ERROR_STOP=1 -c 'SELECT ssl FROM pg_stat_ssl WHERE pid=pg_backend_pid()')" = t; then break; fi
            sleep 1
          done
          test "$(psql "$admin_url" -XAt -v ON_ERROR_STOP=1 -c 'SELECT ssl FROM pg_stat_ssl WHERE pid=pg_backend_pid()')" = t
          {
            printf 'POSTGRES_ADMIN_URL=%s\n' "$admin_url"
            printf 'CENTRAL_DATABASE_URL=%s?%s\n' "$CENTRAL_DATABASE_URL" "$tls_query"
            printf 'POSTGRES_MIGRATOR_URL=postgres://pos_migrator@127.0.0.1:55434/camacho_pos?%s\n' "$tls_query"
          } >> "$GITHUB_ENV"
      - name: Apply canonical commercial schema
        env:
          POSTGRES_EXPECTED_DATABASE: camacho_pos
          REPOSITORY_COMMIT: ${{ env.REVIEWED_SHA }}
          POSTGRES_MIGRATION_LOCK_TIMEOUT_MS: "5000"
          POSTGRES_MIGRATION_STATEMENT_TIMEOUT_MS: "60000"
        run: |
          set -euo pipefail
          pnpm --filter @pos-platform/target-migrations postgres:005:apply
          pnpm --filter @pos-platform/target-migrations exec tsx -e '
            (async () => {
              const { applyPostgres006 } = await import("./src/postgres-006-runner.js");
              const { applyPostgres007 } = await import("./src/postgres-007-runner.js");
              const config = { adminUrl: process.env.POSTGRES_ADMIN_URL!, expectedDatabase: process.env.POSTGRES_EXPECTED_DATABASE!, repositoryCommit: process.env.REPOSITORY_COMMIT! };
              await applyPostgres006(config);
              await applyPostgres007(config);
            })();
          '
          for target in license-catalog cash-register-master commercial-authorization business-owner tenant-initialization cash-register-bindings login-abuse-budget; do
            pnpm --filter @pos-platform/target-migrations postgres:commercial:apply -- "--$target"
          done
      - name: Provision BUSINESS identity and verify real MFA custody
        env:
          D3_DISPOSABLE_IDENTITY_GATE: "YES"
        run: |
          pnpm --filter @pos-platform/central-authority exec tsx -e '
            (async () => {
              const assert = (await import("node:assert/strict")).default;
              const { randomBytes, generateKeyPairSync, createHash, sign } = await import("node:crypto");
              const { uuidV7 } = await import("@pos-platform/contracts");
              const { createPostgresPool } = await import("@pos-platform/database-postgres");
              const { createPlatformPasswordVerifier } = await import("./src/platform-password-verifier.js");
              const { BusinessInitialMfaFlow } = await import("./src/business-initial-mfa-flow.js");
              const { BusinessBrowserSessionIssuer } = await import("./src/business-browser-session-issuer.js");
              const admin = new URL(process.env.POSTGRES_ADMIN_URL!);
              const runtime = new URL(process.env.CENTRAL_DATABASE_URL!);
              for (const [url, role] of [[admin,"postgres"],[runtime,"pos_platform_app"]] as const) {
                assert.equal(url.hostname,"127.0.0.1");
                assert.equal(url.port,"55434");
                assert.equal(url.pathname,"/camacho_pos");
                assert.equal(url.username,role);
                assert.equal(url.searchParams.get("sslmode"),"verify-full");
              }
              assert.equal(process.env.GITHUB_ACTIONS,"true");
              assert.equal(process.env.D3_DISPOSABLE_IDENTITY_GATE,"YES");
              const seed = createPostgresPool(admin.toString(),1);
              const pool = createPostgresPool(runtime.toString(),2);
              const ids = {user:uuidV7(),tenant:uuidV7(),company:uuidV7(),branch:uuidV7(),member:uuidV7(),password:uuidV7(),factor:uuidV7(),material:uuidV7(),assignment:uuidV7()};
              const email = ids.user+"@example.test";
              const password = randomBytes(32).toString("base64url");
              const credentialId = randomBytes(32).toString("base64url");
              const pair = generateKeyPairSync("ec",{namedCurve:"prime256v1"});
              const jwk = pair.publicKey.export({format:"jwk"});
              const cose = Buffer.concat([Buffer.from("a5010203262001215820","hex"),Buffer.from(jwk.x!,"base64url"),Buffer.from("225820","hex"),Buffer.from(jwk.y!,"base64url")]);
              const verifier = await createPlatformPasswordVerifier(password,"owasp-19m-t2-p1");
              const rejectionVerifier = await createPlatformPasswordVerifier(randomBytes(32).toString("base64url"),"owasp-19m-t2-p1");
              const origin = "https://127.0.0.1:9443", rpId = "127.0.0.1";
              try {
                const connection = await seed.connect();
                try {
                  await connection.query("BEGIN");
                  await connection.query("INSERT INTO identity.users(id,email,email_normalized,full_name,status,created_at,updated_at) VALUES ($1,$2,$2,$3,$4,now(),now())",[ids.user,email,"D3 CI owner","ACTIVE"]);
                  await connection.query("INSERT INTO tenancy.tenants(id,name,status,created_at,updated_at) VALUES ($1,$2,$3,now(),now())",[ids.tenant,"D3 CI tenant","ACTIVE"]);
                  await connection.query("INSERT INTO organization.companies(id,tenant_id,trade_name,timezone,currency_code,status,created_at,updated_at) VALUES ($1,$2,$3,$4,$5,$6,now(),now())",[ids.company,ids.tenant,"D3 CI company","America/Bogota","COP","ACTIVE"]);
                  await connection.query("INSERT INTO organization.branches(id,tenant_id,company_id,name,timezone,status,created_at,updated_at) VALUES ($1,$2,$3,$4,$5,$6,now(),now())",[ids.branch,ids.tenant,ids.company,"D3 CI branch","America/Bogota","ACTIVE"]);
                  await connection.query("INSERT INTO tenancy.tenant_memberships(id,tenant_id,user_id,membership_type,status,created_by_actor_type,created_at,activated_at) VALUES ($1,$2,$3,$4,$5,$6,now(),now())",[ids.member,ids.tenant,ids.user,"OWNER","ACTIVE","SYSTEM"]);
                  await connection.query("INSERT INTO identity.user_credentials(id,user_id,credential_type,verifier,status,created_at) VALUES ($1,$2,$3,$4,$5,now())",[ids.password,ids.user,"PASSWORD",verifier,"ACTIVE"]);
                  await connection.query("INSERT INTO identity.mfa_factors(id,user_id,factor_type,secret_reference,status,enrolled_at,verified_at) VALUES ($1,$2,$3,$4,$5,now(),now())",[ids.factor,ids.user,"WEBAUTHN","webauthn:v1:"+ids.material,"ACTIVE"]);
                  await connection.query("INSERT INTO identity.webauthn_credential_material(id,factor_id,credential_id,public_key_cose_base64url) VALUES ($1,$2,$3,$4)",[ids.material,ids.factor,credentialId,cose.toString("base64url")]);
                  const assignment = await connection.query("INSERT INTO \"authorization\".user_role_assignments(id,tenant_id,tenant_membership_id,role_id,company_id,branch_id,status,valid_from,created_at,created_by_actor_type) SELECT $1,$2,$3,id,$4,$5,$6,now(),now(),$7 FROM \"authorization\".roles WHERE code=$8 AND status=$6",[ids.assignment,ids.tenant,ids.member,ids.company,ids.branch,"ACTIVE","SYSTEM","OWNER"]);
                  assert.equal(assignment.rowCount,1);
                  await connection.query("COMMIT");
                } catch (error) { await connection.query("ROLLBACK"); throw error; }
                finally { connection.release(); }
                const flow = new BusinessInitialMfaFlow(pool,{origin,rpId,challengeLifetimeMs:60000,rejectionVerifier,sessionScope:"BUSINESS"});
                assert.equal(await flow.begin({email,password:randomBytes(32).toString("base64url"),correlationId:uuidV7()}),null);
                const begin = await flow.begin({email,password,correlationId:uuidV7()});
                assert.ok(begin);
                assert.equal(begin.credentialId,credentialId);
                const clientData = Buffer.from(JSON.stringify({type:"webauthn.get",challenge:begin.challenge,origin,crossOrigin:false}));
                const authData = Buffer.alloc(37);
                createHash("sha256").update(rpId).digest().copy(authData);
                authData[32]=5;
                authData.writeUInt32BE(1,33);
                const signature = sign("sha256",Buffer.concat([authData,createHash("sha256").update(clientData).digest()]),pair.privateKey);
                const response = {id:credentialId,rawId:credentialId,type:"public-key" as const,clientExtensionResults:{},response:{clientDataJSON:clientData.toString("base64url"),authenticatorData:authData.toString("base64url"),signature:signature.toString("base64url")}};
                const receipt = await flow.complete({email,password,challenge:begin.challenge,response});
                assert.ok(receipt);
                assert.equal(await flow.complete({email,password,challenge:begin.challenge,response}),null);
                const issuer = new BusinessBrowserSessionIssuer(pool,flow,{origin,sessionLifetimeMs:300000,browserLifetimeMs:300000,maximumMfaAgeMs:60000,lockTimeoutMs:2000,statementTimeoutMs:10000});
                const session = await issuer.issue(receipt,ids.tenant,ids.member);
                assert.ok(session.setCookie.startsWith("__Host-camacho_business="));
                assert.ok(session.csrfToken);
                await assert.rejects(issuer.issue(receipt,ids.tenant,ids.member),/BUSINESS_MFA_REQUIRED/);
                const custody = await seed.query("SELECT count(*)::int AS count FROM identity.sessions WHERE user_id=$1 AND tenant_id=$2 AND mfa_status=$3 AND revoked_at IS NULL",[ids.user,ids.tenant,"SATISFIED"]);
                assert.equal(custody.rows[0]?.count,1);
                console.log("D3_BUSINESS_IDENTITY_MFA_SESSION_PASS");
              } finally { await pool.end(); await seed.end(); }
            })().catch(error => { console.error(error instanceof Error ? error.message : "D3_BUSINESS_GATE_FAILED"); process.exitCode=1; });
          '
      - name: Generate ephemeral TLS and issuer keys
        run: |
          set -euo pipefail
          mkdir -p artifacts/d3
          umask 077
          openssl req -x509 -newkey rsa:2048 -nodes -keyout artifacts/d3/tls.key -out artifacts/d3/tls.crt -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -days 1
          openssl genpkey -algorithm ED25519 -out artifacts/d3/issuer.key
          enrollment_token="$(openssl rand -hex 32)"
          session_token="$(openssl rand -hex 32)"
          echo "::add-mask::$enrollment_token"
          echo "::add-mask::$session_token"
          printf 'D3_ENROLLMENT_TRANSPORT_TOKEN=%s\n' "$enrollment_token" >> "$GITHUB_ENV"
          printf 'SESSION_TRUST_TRANSPORT_TOKEN=%s\n' "$session_token" >> "$GITHUB_ENV"
          printf '%s\n' "$session_token" > artifacts/d3/session-trust-transport.token
      - name: Start Central Authority
        env:
          CENTRAL_AUTHORITY_PORT: 9443
          CENTRAL_TLS_KEY_FILE: ${{ github.workspace }}/artifacts/d3/tls.key
          CENTRAL_TLS_CERT_FILE: ${{ github.workspace }}/artifacts/d3/tls.crt
          D3_ISSUER_PRIVATE_KEY_FILE: ${{ github.workspace }}/artifacts/d3/issuer.key
          SESSION_TRUST_ARTIFACT_FILE: ${{ github.workspace }}/infra/trust/session-assertion-operational-key.json
          SESSION_TRUST_TRANSPORT_TOKEN_FILE: ${{ github.workspace }}/artifacts/d3/session-trust-transport.token
        run: |
          set -euo pipefail
          nohup pnpm --filter @pos-platform/central-authority start > artifacts/d3/central-authority.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --cacert artifacts/d3/tls.crt https://127.0.0.1:9443/health > artifacts/d3/health.json; then exit 0; fi
            sleep 1
          done
          cat artifacts/d3/central-authority.log
          exit 1
      - name: Verify session trust publication boundary
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --cacert artifacts/d3/tls.crt -o artifacts/d3/session-trust-unauthorized.json -w '%{http_code}' \
            https://127.0.0.1:9443/v1/session-trust)
          test "$status" = "401"
          status=$(curl --silent --show-error --cacert artifacts/d3/tls.crt -o artifacts/d3/session-trust.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SESSION_TRUST_TRANSPORT_TOKEN}" \
            https://127.0.0.1:9443/v1/session-trust)
          test "$status" = "200"
          grep -q 'SESSION_ASSERTION' artifacts/d3/session-trust.json
          grep -q 'ssa-2026-01' artifacts/d3/session-trust.json
      - name: Verify unauthenticated enrollment rejection
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --cacert artifacts/d3/tls.crt -o artifacts/d3/unauthorized.json -w '%{http_code}' \
            -X POST https://127.0.0.1:9443/v1/device-enrollment \
            -H 'content-type: application/json' --data '{}')
          test "$status" = "401"
          ! grep -Eqi 'password|private.?key|token' artifacts/d3/unauthorized.json
      - name: Execute live enrollment, persistence and replay gate
        env:
          D3_ENROLLMENT_URL: https://127.0.0.1:9443/v1/device-enrollment
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/artifacts/d3/tls.crt
        run: pnpm --filter @pos-platform/central-authority exec tsx tests/live-enrollment-e2e.ts
      - name: Upload D-3 evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d3-live-security-e2e-${{ env.REVIEWED_SHA }}
          path: |
            artifacts
            !artifacts/d3/*.key
            !artifacts/d3/*.token
          if-no-files-found: error
          retention-days: 90
