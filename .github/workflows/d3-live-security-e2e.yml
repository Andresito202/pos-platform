name: D-3 Live Security E2E

on:
  push:
    branches:
      - main
      # Linea activa (`tools/governance/active-line.txt`). Antes apuntaba a
      # `claude/pos-camacho-bloque-4c-ld43py`, absorbida el 2026-09-20: estas
      # puertas no corrian sobre la linea activa.
      - feat/payment-qr-provider-foundation
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3-live-security-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  POSTGRES_ADMIN_URL: postgres://postgres@127.0.0.1:55434/postgres
  CENTRAL_DATABASE_URL: postgres://pos_platform_app@127.0.0.1:55434/postgres
  D3_ENROLLMENT_TRANSPORT_TOKEN: ci-transport-token

jobs:
  d3-live-security-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.REVIEWED_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe502e
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck D-3 packages and authority
        run: |
          pnpm --filter @pos-platform/contracts typecheck
          pnpm --filter @pos-platform/device-trust typecheck
          pnpm --filter @pos-platform/pos-local-service typecheck
          pnpm --filter @pos-platform/target-migrations typecheck
          pnpm --filter @pos-platform/central-authority typecheck
      - name: Run D-3 security tests
        run: |
          pnpm --filter @pos-platform/device-trust test
          pnpm --filter @pos-platform/central-authority test -- session-trust-publication.test.ts session-trust-key-issuer.test.ts
          pnpm --filter @pos-platform/pos-local-service test -- device-trust-credential-store.test.ts device-enrollment-service.test.ts session-trust-key.test.ts session-trust-key-resolver.test.ts session-bootstrap-runtime.test.ts
      - name: Apply PostgreSQL 001-002
        run: |
          pnpm --filter @pos-platform/target-migrations exec tsx -e '
            import { applyPostgres001, applyPostgres002 } from "./src/postgres.js";
            const adminUrl = process.env.POSTGRES_ADMIN_URL!;
            await applyPostgres001({ adminUrl });
            await applyPostgres002({ adminUrl });
          '
      - name: Apply PostgreSQL 003 role readiness
        env:
          POSTGRES_ROLE_READINESS_PROVISIONING_URL: postgres://pos_migrator@127.0.0.1:55434/postgres
          POSTGRES_ROLE_READINESS_VERIFICATION_URL: postgres://pos_platform_admin@127.0.0.1:55434/postgres
          POSTGRES_ROLE_READINESS_ENVIRONMENT_ID: ci-d3
          POSTGRES_ROLE_READINESS_EXPECTED_DATABASE: postgres
          ROLE_READINESS_REPOSITORY_COMMIT: ${{ env.REVIEWED_SHA }}
          ROLE_READINESS_OPERATOR_OR_JOB_ID: github-actions-d3
          ROLE_READINESS_RECEIPT_OUTPUT_PATH: ${{ github.workspace }}/artifacts/d3-role-readiness.json
        run: |
          mkdir -p artifacts
          pnpm --filter @pos-platform/target-migrations role-readiness:003:apply
      - name: Apply PostgreSQL 003
        run: |
          mkdir -p artifacts
          pnpm --filter @pos-platform/target-migrations exec tsx -e '
            import { applyPostgres003 } from "./src/postgres-003-runner.js";
            const result = await applyPostgres003({
              adminUrl: process.env.POSTGRES_ADMIN_URL!,
              expectedDatabase: "postgres",
              environmentId: "ci-d3",
              repositoryCommit: process.env.REVIEWED_SHA!,
              receiptOutputPath: "artifacts/postgres-003.json",
            });
            console.log(JSON.stringify(result));
          '
      - name: Apply PostgreSQL 004
        env:
          POSTGRES_EXPECTED_DATABASE: postgres
          REPOSITORY_COMMIT: ${{ env.REVIEWED_SHA }}
        run: pnpm --filter @pos-platform/target-migrations postgres:004:apply
      - name: Generate ephemeral TLS and issuer keys
        run: |
          set -euo pipefail
          mkdir -p artifacts/d3
          openssl req -x509 -newkey rsa:2048 -nodes -keyout artifacts/d3/tls.key -out artifacts/d3/tls.crt -subj '/CN=localhost' -days 1
          openssl genpkey -algorithm ED25519 -out artifacts/d3/issuer.key
          printf '%s\n' 'ci-session-trust-transport-token' > artifacts/d3/session-trust-transport.token
      - name: Start Central Authority
        env:
          CENTRAL_AUTHORITY_PORT: 9443
          CENTRAL_TLS_KEY_FILE: ${{ github.workspace }}/artifacts/d3/tls.key
          CENTRAL_TLS_CERT_FILE: ${{ github.workspace }}/artifacts/d3/tls.crt
          D3_ISSUER_PRIVATE_KEY_FILE: ${{ github.workspace }}/artifacts/d3/issuer.key
          SESSION_TRUST_ARTIFACT_FILE: ${{ github.workspace }}/infra/trust/session-assertion-operational-key.json
          SESSION_TRUST_TRANSPORT_TOKEN_FILE: ${{ github.workspace }}/artifacts/d3/session-trust-transport.token
        run: |
          set -euo pipefail
          nohup pnpm --filter @pos-platform/central-authority start > artifacts/d3/central-authority.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --insecure https://127.0.0.1:9443/health > artifacts/d3/health.json; then exit 0; fi
            sleep 1
          done
          cat artifacts/d3/central-authority.log
          exit 1
      - name: Verify session trust publication boundary
        env:
          SESSION_TRUST_TRANSPORT_TOKEN: ci-session-trust-transport-token
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --insecure -o artifacts/d3/session-trust-unauthorized.json -w '%{http_code}' \
            https://127.0.0.1:9443/v1/session-trust)
          test "$status" = "401"
          status=$(curl --silent --show-error --insecure -o artifacts/d3/session-trust.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SESSION_TRUST_TRANSPORT_TOKEN}" \
            https://127.0.0.1:9443/v1/session-trust)
          test "$status" = "200"
          grep -q 'SESSION_ASSERTION' artifacts/d3/session-trust.json
          grep -q 'ssa-2026-01' artifacts/d3/session-trust.json
      - name: Verify unauthenticated enrollment rejection
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --insecure -o artifacts/d3/unauthorized.json -w '%{http_code}' \
            -X POST https://127.0.0.1:9443/v1/device-enrollment \
            -H 'content-type: application/json' --data '{}')
          test "$status" = "401"
          ! grep -Eqi 'password|private.?key|token' artifacts/d3/unauthorized.json
      - name: Execute live enrollment, persistence and replay gate
        env:
          D3_ENROLLMENT_URL: https://127.0.0.1:9443/v1/device-enrollment
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: pnpm --filter @pos-platform/central-authority exec tsx tests/live-enrollment-e2e.ts
      - name: Upload D-3 evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d3-live-security-e2e-${{ env.REVIEWED_SHA }}
          path: artifacts
          if-no-files-found: error
          retention-days: 90
