name: Local real login foundation validation
on:
  push:
    branches: [feat/local-password-auth-foundation-20261108]
    paths:
      - 'apps/pos-local-service/src/security/local-operator-password.ts'
      - 'apps/pos-local-service/src/security/local-operator-password.test.ts'
      - 'apps/pos-local-service/src/security/local-operator-password-gate.ts'
      - 'apps/pos-local-service/src/security/local-operator-password-gate.test.ts'
      - 'apps/pos-local-service/src/security/local-operator-session-registry.ts'
      - 'apps/pos-local-service/src/security/local-operator-session-registry.test.ts'
      - 'apps/pos-local-service/src/main.ts'
      - 'apps/pos-local-service/src/config.ts'
      - 'apps/pos-local-service/src/channel/local-channel-component.ts'
      - 'apps/pos-desktop/src/**'
      - 'apps/pos-desktop/renderer/src/**'
      - 'packages/contracts/src/**'
      - 'packages/local-channel/src/**'
      - 'tools/operators/start-local-operator-pos.ps1'
      - '.github/workflows/local-operator-auth-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-local-passwords:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile
      - name: Typecheck contracts, transport, service and desktop
        run: |
          pnpm --filter @pos-platform/contracts typecheck
          pnpm --filter @pos-platform/local-channel typecheck
          pnpm --filter @pos-platform/pos-local-service typecheck
          pnpm --filter @pos-platform/pos-desktop typecheck
      - name: Verify password-gate constraints
        run: pnpm --filter @pos-platform/pos-local-service exec vitest run src/security/local-operator-password.test.ts src/security/local-operator-password-gate.test.ts src/security/local-operator-session-registry.test.ts

  windows-local-service-start:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile
      - name: Verify Windows PowerShell launcher syntax
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path tools/operators/start-local-operator-pos.ps1).Path,
            [ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { throw "WINDOWS_LOCAL_OPERATOR_LAUNCHER_SYNTAX_INVALID" }
      - name: Create ephemeral Windows operator accounts
        shell: pwsh
        run: |
          node tools/operators/local-development-accounts.mjs init | ForEach-Object {
            if ($_ -match '^PASSWORDS_SHOWN_ONCE') { Write-Host 'LOCAL_ACCOUNT_STORE_CREATED' }
          }
          if ($LASTEXITCODE -ne 0) { throw 'LOCAL_ACCOUNT_INIT_FAILED' }
      - name: Boot actual local Windows service and durable database
        shell: pwsh
        run: pwsh -NoProfile -File tools/operators/start-local-operator-pos.ps1 -SkipBuild -ServiceOnly
