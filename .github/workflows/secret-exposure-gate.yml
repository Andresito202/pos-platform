name: Secret exposure gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked local environments and generated Next cache
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8", "surrogateescape").split("\0")
          bad = []
          for path in paths:
              if not path:
                  continue
              parts = pathlib.PurePosixPath(path).parts
              name = parts[-1]
              if ".next" in parts or name == ".env" or (name.startswith(".env.") and name not in {".env.example", ".env.template", ".env.sample"}):
                  bad.append(path)
          for path in bad:
              print("Forbidden tracked path:", repr(path))
          sys.exit(bool(bad))
          PY
      - name: Scan reachable Git history with redaction
        if: always() && !cancelled()
        shell: bash
        run: |
          report_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")"
          trap 'rm -rf "$report_dir"' EXIT
          docker pull ghcr.io/gitleaks/gitleaks:v8.24.2
          status=0
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$report_dir:/report" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 git --redact=100 --exit-code=42 \
            --report-format=json --report-path=/report/findings.json --log-opts="--all" /repo \
            >"$report_dir/scan.log" 2>&1 || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 42 ]; then
            echo "Gitleaks execution failed (exit $status); no scanner output published."
            exit "$status"
          fi
          python3 - "$report_dir/findings.json" "$status" <<'PY'
          import json, pathlib, sys
          report = pathlib.Path(sys.argv[1])
          if not report.is_file():
              raise SystemExit("Missing scanner report")
          findings = json.loads(report.read_text()) or []
          print("Detected occurrences:", len(findings))
          for finding in findings:
              # Never publish Match, Secret, entropy, source lines or raw scanner output.
              print(json.dumps({key: finding.get(key) for key in ("RuleID", "File", "StartLine", "Commit")}, ensure_ascii=True))
          if findings or int(sys.argv[2]) != 0:
              raise SystemExit(1)
          PY
