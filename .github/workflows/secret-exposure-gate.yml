name: Secret exposure gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject tracked local environments and generated Next cache
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, sys
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode("utf-8", "surrogateescape").split("\0")
          bad = []
          for path in paths:
              if not path:
                  continue
              parts = pathlib.PurePosixPath(path).parts
              name = parts[-1]
              if ".next" in parts or name == ".env" or (name.startswith(".env.") and name not in {".env.example", ".env.template", ".env.sample"}):
                  bad.append(path)
          for path in bad:
              print("Forbidden tracked path:", repr(path))
          sys.exit(bool(bad))
          PY
      - name: Scan reachable Git history with redaction
        if: always() && !cancelled()
        shell: bash
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:v8.24.2
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 git --redact=100 --log-opts="--all" /repo
