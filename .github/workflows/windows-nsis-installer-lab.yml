name: Windows NSIS installer lab

# Unsigned electron-builder/NSIS lab on windows-2022:
# generate installer → silent install/upgrade/uninstall → real-auth commercial
# captures. Authenticode remains RT-009-B BLOCKED. Distinguishes lab runner
# evidence from physical certification.

on:
  push:
    branches:
      - cursor/commercial-design-review-0d11
    paths:
      - '.github/workflows/windows-nsis-installer-lab.yml'
      - 'apps/pos-desktop/**'
      - 'apps/pos-local-service/**'
      - 'packages/local-channel/native/**'
      - 'packages/local-channel/package.json'
      - 'tools/operators/windows-nsis-lab-lifecycle.ps1'
      - 'tools/operators/windows-nsis-lab-sqlite-marker.mjs'
      - 'tools/operators/windows-nsis-scm-g1-identity.ps1'
      - 'tools/operators/windows-nsis-security-negatives.ps1'
      - 'tools/operators/ci-windows-scm-identity-service.cs'
      - 'tools/operators/ci-windows-scm-native-peer.mjs'
      - 'pnpm-lock.yaml'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/windows-nsis-installer-lab.yml'
      - 'apps/pos-desktop/**'
      - 'apps/pos-local-service/**'
      - 'packages/local-channel/native/**'
      - 'packages/local-channel/package.json'
      - 'tools/operators/windows-nsis-lab-lifecycle.ps1'
      - 'tools/operators/windows-nsis-lab-sqlite-marker.mjs'
      - 'tools/operators/windows-nsis-scm-g1-identity.ps1'
      - 'tools/operators/windows-nsis-security-negatives.ps1'
      - 'tools/operators/ci-windows-scm-identity-service.cs'
      - 'tools/operators/ci-windows-scm-native-peer.mjs'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: windows-nsis-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis-lab:
    name: Generate unsigned NSIS installer (lab)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Build desktop bundles
        shell: pwsh
        run: |
          pnpm --filter @pos-platform/pos-desktop build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build POS Local Service win32 artifact for NSIS payload
        shell: pwsh
        run: |
          $env:POS_ARTIFACT_TARGET = 'win32-x64'
          pnpm --filter @pos-platform/pos-local-service build:artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'apps/pos-local-service/dist/pos-local-service-0.0.0-win32-x64.tar.gz')) {
            throw 'LOCAL_SERVICE_WIN32_ARTIFACT_MISSING'
          }

      - name: Verify brand icon for packager
        shell: pwsh
        run: |
          if (-not (Test-Path "apps/pos-desktop/packaging/icon.png")) {
            throw "MISSING_BRAND_ICON: apps/pos-desktop/packaging/icon.png"
          }

      - name: Compile native Windows pipe addon (G1 on installed SCM)
        shell: pwsh
        run: |
          pnpm --filter @pos-platform/local-channel native:build:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $addon = 'packages/local-channel/native/build/Release/camacho_windows_pipe.node'
          if (-not (Test-Path -LiteralPath $addon -PathType Leaf)) { throw 'NATIVE_BINARY_NOT_BUILT' }
          Write-Host ('NATIVE_ADDON_SHA256=' + (Get-FileHash -LiteralPath $addon -Algorithm SHA256).Hash)

      - name: Generate NSIS installer (unsigned lab, with WinSW service payload)
        shell: pwsh
        run: |
          pnpm --filter @pos-platform/pos-desktop pack:windows-nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Inventory installer artifacts and SHA-256
        shell: pwsh
        run: |
          $out = "apps/pos-desktop/dist-installer"
          if (-not (Test-Path $out)) { throw "DIST_INSTALLER_MISSING" }
          Get-ChildItem -Recurse $out | ForEach-Object { $_.FullName }
          # Only the product NSIS artifact — ignore helpers like elevate.exe.
          $exes = @(Get-ChildItem -Path $out -Filter 'CamachoPOSColombia-*-win-*.exe' -Recurse)
          if ($exes.Count -lt 1) { throw "NSIS_EXE_NOT_GENERATED" }
          $report = @()
          $primary = $exes | Select-Object -First 1
          foreach ($exe in $exes) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
            $line = "{0}  {1}  bytes={2}" -f $hash, $exe.Name, $exe.Length
            Write-Output $line
            $report += $line
          }
          $primaryHash = (Get-FileHash -Algorithm SHA256 -Path $primary.FullName).Hash.ToLowerInvariant()
          "INSTALLER_PATH=$($primary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_SHA256=$primaryHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_NAME=$($primary.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $report += "authenticode=UNSIGNED_LAB_ONLY"
          $report += "rt009b=BLOCKED_REQUIRES_CERTIFICATE"
          $report += "reviewed_sha=$env:GITHUB_SHA"
          $report += "certification_scope=WINDOWS_LAB_RUNNER_NOT_PHYSICAL"
          $report -join "`n" | Set-Content -Path "$out/installer-integrity.txt" -Encoding utf8

      - name: Silent NSIS lifecycle (install/upgrade/uninstall)
        id: nsis_lifecycle
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'nsis-lifecycle'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $installer = Get-ChildItem -Path "apps/pos-desktop/dist-installer" -Filter *.exe -Recurse |
            Where-Object { $_.Name -like 'CamachoPOSColombia-*-win-*.exe' } |
            Select-Object -First 1
          if (-not $installer) { throw "LIFECYCLE_INSTALLER_MISSING" }
          pwsh -NoProfile -File tools/operators/windows-nsis-lab-lifecycle.ps1 `
            -InstallerPath $installer.FullName `
            -WorkRoot $work `
            -RepoRoot (Resolve-Path '.').Path
          $code = $LASTEXITCODE
          $report = Join-Path $work 'nsis-lifecycle-report.json'
          if (Test-Path -LiteralPath $report) {
            Copy-Item -Force $report "apps/pos-desktop/dist-installer/nsis-lifecycle-report.json"
            Get-Content -LiteralPath $report | Write-Host
          } else {
            Write-Host 'LIFECYCLE_REPORT_MISSING_AFTER_RUN'
          }
          # Also copy service logs when present for exact failure diagnosis.
          foreach ($logName in @('service.stdout.log','service.stderr.log')) {
            $logPath = Join-Path $work $logName
            if (Test-Path -LiteralPath $logPath) {
              Copy-Item -Force $logPath "apps/pos-desktop/dist-installer/$logName"
            }
          }
          if ($code -ne 0) { exit $code }

      - name: Preserve lifecycle report on failure
        if: ${{ failure() && steps.nsis_lifecycle.outcome == 'failure' }}
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'nsis-lifecycle/nsis-lifecycle-report.json'
          if (Test-Path -LiteralPath $report) {
            New-Item -ItemType Directory -Force -Path "apps/pos-desktop/dist-installer" | Out-Null
            Copy-Item -Force $report "apps/pos-desktop/dist-installer/nsis-lifecycle-report.json"
            Get-Content $report
          } else {
            Write-Output "LIFECYCLE_REPORT_MISSING"
          }

      - name: Windows desktop smoke + session/role negatives
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          pnpm --filter @pos-platform/pos-desktop exec vitest run tests/window-security.test.ts tests/ipc-allowlist.test.ts --no-file-parallelism
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @pos-platform/pos-local-service exec vitest run `
            tests/windows-dpapi.test.ts `
            tests/windows-winsw-readiness.test.ts `
            tests/native-session-close-lifecycle.test.ts `
            tests/windows-scm-commercial-entry-process.test.ts `
            src/commercial/local-operator-authorization.test.ts `
            src/security/local-operator-session-registry.test.ts `
            --no-file-parallelism
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'FOUR_ROLE_AUTH_NEGATIVES=PASS'
          Write-Host 'SESSION_CLOSE_REVOKE=PASS'
          Write-Host 'SCM_COMMERCIAL_ENTRY_FAIL_CLOSED=PASS'

      - name: Real-auth commercial Electron live + screenshots
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $captures = Join-Path $env:RUNNER_TEMP 'commercial-captures'
          New-Item -ItemType Directory -Force -Path $captures | Out-Null
          $env:POS_E2E_AUDIT_DIRECTORY = $captures
          # Real named-pipe + DPAPI + password auth. Not role-preview.
          pnpm --filter @pos-platform/pos-desktop exec playwright test --config e2e/playwright.config.ts e2e/local-operator-live.spec.ts --workers=1 --retries=0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dest = "apps/pos-desktop/dist-installer/commercial-captures"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Force -Recurse "$captures\*" $dest
          Get-ChildItem $dest | ForEach-Object { Write-Output "CAPTURE=$($_.Name) bytes=$($_.Length)" }

      - name: Upload NSIS lab artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: camacho-pos-nsis-lab-${{ github.sha }}
          path: |
            apps/pos-desktop/dist-installer/**
          if-no-files-found: error
          retention-days: 14
