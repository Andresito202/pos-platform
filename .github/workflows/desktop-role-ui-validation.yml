name: Desktop role UI validation

on:
  pull_request:
    paths:
      - "apps/pos-desktop/renderer/**"
      - "apps/pos-desktop/tests/renderer/**"
      - ".github/workflows/desktop-role-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-role-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Desktop renderer TypeScript, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck POS desktop
        run: pnpm --filter @pos-platform/pos-desktop typecheck
      - name: Run all desktop unit tests
        run: pnpm --filter @pos-platform/pos-desktop test
      - name: Build renderer
        run: pnpm --filter @pos-platform/pos-desktop build:renderer
