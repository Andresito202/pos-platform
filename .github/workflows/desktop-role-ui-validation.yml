name: Desktop role UI validation

on:
  pull_request:
    paths:
      - "apps/pos-desktop/renderer/**"
      - "apps/pos-desktop/tests/renderer/**"
      - ".github/workflows/desktop-role-ui-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-role-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Desktop renderer TypeScript, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck POS desktop
        run: pnpm --filter @pos-platform/pos-desktop typecheck
      - name: Focused role and commercial UI regressions
        run: >-
          pnpm --filter @pos-platform/pos-desktop exec vitest run
          --config vitest.config.ts
          tests/renderer/SalePanel.test.tsx
          tests/renderer/InventoryPanel.permissions.test.tsx
          tests/renderer/CatalogPanel.permissions.test.tsx
          tests/renderer/CustomerHardware.permissions.test.tsx
          tests/renderer/AdminPanels.test.tsx
      - name: Run all desktop unit tests (no skipped failures)
        run: pnpm --filter @pos-platform/pos-desktop test
      - name: Build complete Electron shell
        if: ${{ !cancelled() }}
        run: pnpm --filter @pos-platform/pos-desktop build
      - name: Boot compiled Electron with Playwright and capture isolated visual evidence
        if: ${{ !cancelled() }}
        env:
          POS_E2E_AUDIT_DIRECTORY: ${{ github.workspace }}/artifacts/ci/desktop-role-ui
        run: xvfb-run -a pnpm --filter @pos-platform/pos-desktop test:e2e
      - name: Upload isolated Electron screenshots and layout observations
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-role-ui-evidence-${{ github.sha }}
          path: artifacts/ci/desktop-role-ui/
          if-no-files-found: warn
          retention-days: 30
