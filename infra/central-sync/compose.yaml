services:
  central-sync:
    build:
      context: ../..
      dockerfile: infra/docker/central-authority/Dockerfile
    working_dir: /app/tools/target-migrations
    command: ["node", "--import", "tsx", "src/central-sync-server.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      PORT: "8787"
      OTEL_ENABLE_API: ${OTEL_ENABLE_API:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/ready', { signal: AbortSignal.timeout(3500) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    expose:
      - "8787"
    networks:
      - central-sync

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      central-sync:
        condition: service_healthy
    environment:
      CENTRAL_SYNC_DOMAIN: ${CENTRAL_SYNC_DOMAIN:?CENTRAL_SYNC_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - central-sync

networks:
  central-sync:
    driver: bridge
    internal: false

volumes:
  caddy-data:
  caddy-config:
