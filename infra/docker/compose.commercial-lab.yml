# Isolated rehearsal. Pre-provision roles with the existing migration tools.
services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  central:
    image: camacho-pos/central-authority:local
    build:
      context: ../..
      dockerfile: infra/docker/central-authority/Dockerfile
    profiles: ["central"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ${CENTRAL_RUNTIME_ENV_FILE:-./lab-secrets/central.env}
        required: true
    environment:
      CENTRAL_AUTHORITY_PORT: "8443"
      CENTRAL_BIND_ADDRESS: "0.0.0.0"
      CENTRAL_TLS_KEY_FILE: /run/tls/server.key
      CENTRAL_TLS_CERT_FILE: /run/tls/server.crt
      CENTRAL_RATE_LIMIT_BACKEND: postgres
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./lab-secrets:/run/secrets:ro
      - ./lab-tls:/run/tls:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_PATH:-./lab-secrets/postgres-password}

volumes:
  postgres-data:
