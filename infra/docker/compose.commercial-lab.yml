# Lab-only compose. Do not deploy to production without owner authorization.
# TLS certs and secrets must be bind-mounted; nothing sensitive in the image.
services:
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Optional OTLP collector — disabled by default (no cloud export without auth).
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:0.114.0
  #   profiles: ["otel"]
  #   volumes:
  #     - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  central:
    build:
      context: ../..
      dockerfile: infra/docker/central-authority/Dockerfile
    profiles: ["central"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CENTRAL_AUTHORITY_PORT: "8443"
      CENTRAL_DATABASE_URL: postgres://pos_platform_app@postgres:5432/postgres
      CENTRAL_RATE_LIMIT_BACKEND: postgres
      OTEL_ENABLE_API: "0"
    ports:
      - "8443:8443"
    volumes:
      - ./lab-secrets:/run/secrets:ro
      - ./lab-tls:/run/tls:ro
