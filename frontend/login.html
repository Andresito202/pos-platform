<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso | Supermercado Avicola</title>
  <meta property="og:title" content="Supermercado Avícola | Sistema de gestión comercial">
  <meta property="og:description" content="Aplicación Full-Stack para gestión de inventario, ventas, caja, productos, clientes y reportes, desarrollada con FastAPI, PostgreSQL, Docker y Render.">
  <meta property="og:image" content="https://supermercado-avicola.onrender.com/static/img/supermercado-avicola-og.png">
  <meta property="og:url" content="https://supermercado-avicola.onrender.com/login.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Supermercado Avícola | Sistema de gestión comercial">
  <meta name="twitter:description" content="Demo pública Full-Stack con roles, inventario, ventas, caja y reportes.">
  <meta name="twitter:image" content="https://supermercado-avicola.onrender.com/static/img/supermercado-avicola-og.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="login-container">
    <div class="card login-card">
      <div class="card-header">
        <h4 class="mb-0">Supermercado Avicola</h4>
        <small>Sistema integral de gestion comercial</small>
      </div>
      <div class="card-body p-4">
        <div id="alertBox"></div>
        <form id="loginForm" autocomplete="off">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control" autocomplete="off" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Contrasena</label>
            <input type="password" id="password" class="form-control" autocomplete="off" required>
          </div>
          <button type="submit" class="btn btn-success w-100" id="btnLogin">Iniciar Sesion</button>
        </form>

        <div class="demo-credentials mt-4 pt-3 border-top">
          <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <div>
              <h6 class="mb-1">Acceso demo para evaluacion tecnica</h6>
              <p class="text-muted small mb-0">Selecciona un perfil y el formulario se completara automaticamente.</p>
            </div>
            <span class="badge text-bg-light border">Demo</span>
          </div>
          <div id="demoCredentials" class="d-grid gap-2"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="static/js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (getToken()) window.location.href = '/index.html';

    const demoCredentials = [
      { role: 'Administrador', username: 'admin', password: 'Admin123!' },
      { role: 'Cajero', username: 'cajero1', password: 'Cajero123!' },
      { role: 'Bodeguero', username: 'bodeguero1', password: 'Bodega123!' },
      { role: 'Supervisor', username: 'supervisor1', password: 'Super123!' },
      { role: 'Gerente', username: 'gerente1', password: 'Gerente123!' },
    ];

    function renderDemoCredentials() {
      const container = document.getElementById('demoCredentials');
      container.replaceChildren();

      demoCredentials.forEach((credential, index) => {
        const card = document.createElement('div');
        card.className = 'demo-card';

        const header = document.createElement('div');
        header.className = 'demo-card-header';
        const role = document.createElement('strong');
        role.textContent = credential.role;
        header.appendChild(role);

        const identity = document.createElement('div');
        identity.className = 'demo-profile-identity';
        const username = document.createElement('code');
        username.textContent = credential.username;
        const password = document.createElement('span');
        password.textContent = 'Credencial protegida';
        identity.append(username, password);

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'btn btn-outline-success btn-sm demo-profile-button';
        button.dataset.profile = String(index);
        button.textContent = 'Usar este perfil';

        card.append(header, identity, button);
        container.appendChild(card);
      });
    }

    function selectDemoProfile(index, button) {
      const credential = demoCredentials[index];
      document.getElementById('username').value = credential.username;
      document.getElementById('password').value = credential.password;
      document.querySelectorAll('button[data-profile]').forEach(item => {
        item.textContent = 'Usar este perfil';
        item.classList.remove('btn-success');
        item.classList.add('btn-outline-success');
      });
      button.textContent = 'Perfil listo';
      button.classList.remove('btn-outline-success');
      button.classList.add('btn-success');
      document.getElementById('btnLogin').focus();
    }

    renderDemoCredentials();

    document.getElementById('demoCredentials').addEventListener('click', (event) => {
      const button = event.target.closest('button[data-profile]');
      if (!button) return;
      selectDemoProfile(Number(button.dataset.profile), button);
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Ingresando...';

      try {
        const data = await apiPost('/auth/login', { username, password });
        setToken(data.access_token);
        setUser(data.usuario);
        window.location.href = '/index.html';
      } catch (err) {
        showAlert(document.getElementById('alertBox'), err.message || 'No fue posible iniciar sesion. Intenta nuevamente.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesion';
      }
    });
  </script>
</body>
</html>
